; ESP32-S3-WROOM-1-N8R2: 8 MB quad-SPI flash, 2 MB quad-SPI PSRAM.
; Serial output goes to UART0 (the "UART" USB port on a DevKitC-1).

[env:esp32s3-n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
; TLS material for AWS IoT Core, compiled into the image. Put the three files in certs/ (see certs/README.md).
board_build.embed_txtfiles =
    certs/AmazonRootCA1.pem
    certs/device.cert.pem
    certs/device.private.key
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.2
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0

; ESP32-S3-WROOM-1-N16R8 (16 MB quad flash, 8 MB octal PSRAM). Same firmware; only the memory setup differs.
; esptool on the attached board reported exactly this, so this is the environment to use for it.
[env:esp32s3-n16r8]
extends = env:esp32s3-n8r2
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; Temporary SPI bus diagnostic (replaces the logger firmware on the board until you flash it again).
[env:diag-n16r8]
extends = env:esp32s3-n16r8
build_src_filter = -<*> +<../tools/bus_diag.cpp>

; Host-side unit tests for the offline queue: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
test_build_src = no
