; ESP32-S3-WROOM-1-N8R2: 8 MB quad-SPI flash, 2 MB quad-SPI PSRAM.
; Serial output goes to UART0 (the "UART" USB port on a DevKitC-1).

[env:esp32s3-n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.2
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0

; Host-side unit tests for the offline queue: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
test_build_src = no
